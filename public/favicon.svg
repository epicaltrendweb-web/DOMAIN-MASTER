<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- DOMAIN-MASTER icon: magnifier on emerald rounded square.
       Concept: "search finds free domains". Simple shape that scales
       from 16x16 (favicon) to 1024+ (og-image, apple-touch). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background: emerald gradient rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Magnifier lens (white circle, slightly above-left of center) -->
  <circle cx="13" cy="13" r="7" fill="#ffffff"/>
  <!-- Inner emerald ring (gives depth, makes lens clearly a magnifier) -->
  <circle cx="13" cy="13" r="7" fill="none" stroke="#059669" stroke-width="1.4"/>
  <!-- Center dot (emerald) — represents "found something" -->
  <circle cx="13" cy="13" r="2.4" fill="#059669"/>
  <!-- Handle: thick white line from lens edge to bottom-right corner -->
  <line x1="18" y1="18" x2="26.5" y2="26.5" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
